name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6
        with:
          node-version: '20'
      - run: npm ci
      - run: node --check server.js
      - run: node --check examples/cloud-runner/server.js
      - run: npm test
      - run: npm run smoke

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2  # v2
        with:
          channel: stable
      - run: flutter --version
      - run: flutter pub get
      # Errors-only gate: fails on real API breakage (removed/changed symbols) from
      # dependency bumps, not on the app's pre-existing lint debt (infos/warnings).
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings

  desktop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      # Package an unpacked Linux build: validates electron / electron-builder bumps
      # actually install and package (no AppImage/system libs needed for `dir`).
      - run: npx --no-install electron-builder --linux dir
