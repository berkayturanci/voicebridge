name: voicebridge_app
description: Native iOS/Android client for the voicebridge agent — talk to Claude Code from your phone.
publish_to: "none"
version: 0.2.0+2

environment:
  # package:material_ui (replaces package:flutter/material.dart, deprecated in
  # Flutter 3.50) needs Dart 3.13+ / Flutter 3.47+.
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.5.6
  speech_to_text: ^7.5.0
  flutter_tts: ^4.2.5
  audioplayers: ^6.1.0    # play bridge-side (Piper) neural TTS audio, opt-in
  wakelock_plus: ^1.8.0   # keep the screen awake during talking mode (so the connection doesn't drop)
  url_launcher: ^6.3.0    # open privacy, support, and docs links from settings
  mobile_scanner: ^7.4.2  # scan the bridge's startup QR (README-promised pairing flow, #212)
  material_ui: ^1.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

# App icon — the voicebridge "voice bubble" mark. Sources live in assets/icon/
# (copied from the repo's branding/). Regenerate with: dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/icon/icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#0d1117"
  adaptive_icon_foreground: "assets/icon/foreground.png"
  macos:
    generate: true
    image_path: "assets/icon/icon.png"
  web:
    generate: true
    background_color: "#0d1117"
    theme_color: "#0d1117"
